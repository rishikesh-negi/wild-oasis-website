name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 0 */6 * *"
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest

    steps:
      - name: Query Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/cabins?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
